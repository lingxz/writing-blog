---
layout: default
---

<div class="header">
	<div class="title light-title"><a href="{{ '/' | absolute_url }}">&#171; home</a></div>
</div>

<div class="post">
	<h1 class="post-title">{{ page.title }}</h1>
    {% if page.small %}
        <div class="post-content small">{{ content }}</div>
    {% else %}
        <div class="post-content">{{ content }}</div>
    {% endif %}
</div>
