    <div class="post-content"><p>只要一个沉默的夜晚<br />
若无云，风便也多余<br />
坐在最高的山丘<br />
带一颗贫穷的心</p>

<p>把回忆酿成酒<br />
倒进银河<br />
只有它能解妄夜的渴<br />
星空从东到西回转<br />
你所有灰暗的过去<br />
会洒满一幕夜色<br />
对于这半生<br />
你终于能做一个旁观者</p>

<p>如果看见月亮<br />
就找一件重物，比如命运<br />
用力朝它砸去<br />
把未来揉成云<br />
抛到一旁<br />
观星只有一个规矩<br />
你要爱朗朗星空的群星<br />
胜过爱任何一个特定的光亮</p>
</div>
