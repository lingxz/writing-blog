    <div class="post-date">写于2024年09月24日</div>
    <div class="post-content"><p>鸟儿呀你慢点飞<br />
让我好好看你一眼<br />
我想用相机定格你漂亮的羽毛<br />
和恣意的翅膀<br />
浩瀚草原上，我只要你一瞬间</p>

<p>鸟儿呀你肆意地飞<br />
你才不在乎一瞬间<br />
天地广阔，你不屑停在树枝上<br />
忍受旁人眼光，屈于他人念想<br />
就算我捕捉了你的模样，那也是骗人的<br />
从东到西，从南到北<br />
你的翅膀不肯有片刻的停歇</p>

<p>可是鸟儿呀你慢点飞<br />
让我好好看你一眼<br />
因为一眨眼就是永不相见</p>
</div>
