    <div class="post-content"><p><em>声息</em><br />
那一天你就在我右边<br />
微笑着 温暖着<br />
而我等待着<br />
那个不会有的结局<br />
那个你不会做的选择</p>

<p><em>星空</em><br />
那一年你躺在我左边<br />
一起仰望星空<br />
流星划过<br />
我们期待着 浪漫着<br />
而我许下那个不会实现的心愿</p>

<p><em>拥抱</em><br />
那一夜你就在我胸前<br />
呼吸着 缠绵着<br />
而你知不知道<br />
我有多想就这样不松手<br />
把你绑紧了 别走了</p>
</div>
