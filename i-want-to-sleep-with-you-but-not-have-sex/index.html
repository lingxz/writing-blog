    <div class="post-content"><p>我想抱着你睡，但不做爱<br />
就这样安静地躺在彼此身边<br />
热了就翻一个身<br />
想你了就靠得近一些<br />
睡不着就抬头，发现，嘿<br />
正好你也没睡一起聊聊天</p>

<p>如果外面传来淅沥的雨声<br />
我想要我们的灵魂缠绕在一起<br />
炙热到冒烟，蒸发整个雨夜<br />
我想要热烈而纯洁，绵长又干脆<br />
今晚，我们不谈世俗欲望，只谈心意<br />
我想抱着你睡<br />
仅此而已</p>
